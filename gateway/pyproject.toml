[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mesh-gateway"
version = "0.1.0"
description = "AI Mesh LLM gateway — attribution, metering, fail-closed budgets"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi", "uvicorn[standard]", "httpx", "pydantic>=2", "pydantic-settings", "structlog",
  "tokenizers", "psycopg[binary]", "sqlalchemy>=2", "zstandard", "python-ulid",
]

[project.optional-dependencies]
dev = [
  "pytest", "pytest-asyncio", "pytest-timeout", "pytest-cov", "hypothesis", "respx",
  "mypy", "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mesh_gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT", "ASYNC", "DTZ"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --timeout=300"
markers = [
  "unit: pure functions and classes, no external deps",
  "integration: module + real PostgreSQL/upstream fakes",
  "contract: OpenAI-compatibility and schema conformance",
  "conformance: durability and fault injection",
  "security: isolation tests",
  "e2e: real model through the tunnel (never in CI)",
  "gpu: benchmarks touching the GPU",
]
asyncio_mode = "auto"
